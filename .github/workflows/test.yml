name: Tests

on:
  workflow_call:
    inputs:
      run_all:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_all:
        type: boolean
        default: true

jobs:
  # Détecte une seule fois les fichiers modifiés ; les autres jobs s'y réfèrent
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      client: ${{ steps.f.outputs.client }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: f
        with:
          base: ${{ github.ref_name }}
          filters: |
            server:
              - 'gas/Alfred.js'
              - '.github/workflows/test.yml'
              - '.github/actions/setup/**'
            client:
              - 'e2e/tests/*.spec.js'
              - '**/*.html'
              - '.github/workflows/test.yml'
              - '.github/actions/setup/**'

  test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || inputs.run_all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run jest tests
        run: npm test

  build-test:
    needs: [changes, test]
    if: needs.changes.outputs.server == 'true' || inputs.run_all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run build tests
        run: npm run build:test

  playwright-test:
    needs: changes
    if: needs.changes.outputs.client == 'true' || inputs.run_all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run playwright tests
        run: npm run test:e2e
        env:
          CI: true
