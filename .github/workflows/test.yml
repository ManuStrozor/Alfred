name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Détecte une seule fois les fichiers modifiés ; les autres jobs s'y réfèrent
  changes:
    runs-on: ubuntu-latest
    outputs:
      alfred: ${{ steps.f.outputs.alfred }}
      html:   ${{ steps.f.outputs.html }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            alfred: ['gas/Alfred.js']
            html:   ['**/*.html']

  test:
    needs: changes
    if: needs.changes.outputs.alfred == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run jest tests
        run: npm test

  build-test:
    needs: [changes, test]
    if: needs.changes.outputs.alfred == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run build tests
        run: npm run build:test

  playwright-test:
    needs: changes
    if: needs.changes.outputs.html == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run playwright tests
        run: npm run test:e2e
        env:
          CI: true
