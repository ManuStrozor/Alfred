name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Détecte une seule fois les fichiers modifiés ; les autres jobs s'y réfèrent
  changes:
    runs-on: ubuntu-latest
    outputs:
      alfred: ${{ steps.f.outputs.alfred }}
      html:   ${{ steps.f.outputs.html }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: f
        with:
          base: ${{ github.ref_name }}
          filters: |
            alfred:
              - 'gas/Alfred.js'
              - '.github/workflows/test.yml'
              - '.github/actions/setup/**'
            html:
              - '**/*.html'
              - '.github/workflows/test.yml'
              - '.github/actions/setup/**'

  test:
    needs: changes
    if: needs.changes.outputs.alfred == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run jest tests
        run: npm test

  build-test:
    needs: [changes, test]
    if: needs.changes.outputs.alfred == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run build tests
        run: npm run build:test

  playwright-test:
    needs: changes
    if: needs.changes.outputs.html == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run playwright tests
        run: npm run test:e2e
        env:
          CI: true
