name: Deploy to Google Apps Script (dev)

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Ensure CI workflow succeeded for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking CI workflow run for commit $GITHUB_SHA"
          owner_repo="${GITHUB_REPOSITORY}"
          owner=${owner_repo%/*}
          repo=${owner_repo#*/}
          # Normalize branch — if GITHUB_REF is a tag, leave branch empty
          if [[ "${GITHUB_REF#refs/heads/}" != "${GITHUB_REF}" ]]; then
            branch=${GITHUB_REF#refs/heads/}
          else
            branch=
          fi

          if [ -n "$branch" ]; then
            runs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$owner/$repo/actions/workflows/ci.yml/runs?per_page=50&branch=$branch")
          else
            runs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$owner/$repo/actions/workflows/ci.yml/runs?per_page=50")
          fi

          run=$(echo "$runs_json" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha) | @base64' | head -n1)
          if [ -z "$run" ]; then
            echo "No CI run found for commit $GITHUB_SHA; aborting."
            exit 1
          fi
          conclusion=$(echo "$run" | base64 --decode | jq -r '.conclusion')
          echo "CI conclusion: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "CI did not succeed. Aborting."
            exit 1
          fi

      - name: Check if Alfred.js was modified
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^gas/Alfred\.js$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.changed == 'true'

      - run: npm test
        if: steps.check.outputs.changed == 'true'

      - name: Tests skipped (Alfred.js inchangé)
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ Alfred.js non modifié — tests Jest ignorés."

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Google Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --deploymentId "${{ vars.DEPLOY_ID }}" --description "dev"
