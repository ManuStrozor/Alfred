name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if Alfred.js was modified
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^gas/Alfred\.js$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.changed == 'true'

      - run: npm test
        if: steps.check.outputs.changed == 'true'

      - name: Tests skipped (Alfred.js inchangé)
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ Alfred.js non modifié — tests Jest ignorés."

  build-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if Alfred.js was modified
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^gas/Alfred\.js$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.changed == 'true'

      - run: npm run build:test
        if: steps.check.outputs.changed == 'true'

      - name: Build-test skipped (Alfred.js inchangé)
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ Alfred.js non modifié — build:test ignoré."

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if Alfred.js was modified
        id: check-e2e
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^gas/Alfred\.js$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        if: steps.check-e2e.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: steps.check-e2e.outputs.changed == 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: steps.check-e2e.outputs.changed == 'true'

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true
        if: steps.check-e2e.outputs.changed == 'true'

      - name: E2E skipped (Alfred.js inchangé)
        if: steps.check-e2e.outputs.changed == 'false'
        run: echo "✅ Alfred.js non modifié — tests e2e ignorés."
