name: Deploy to GAS

run-name: Deploy to GAS (${{ github.ref_name }})

on:
  release:
    types: [published]
  push:
    branches: [dev]
    paths:
      - 'gas/**'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      run_all: ${{ github.event_name == 'release' }}

  deploy:
    needs: test
    # Déploie si les tests réussissent OU sont ignorés ; jamais s'ils échouent
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: Push to Google Apps Script
        run: clasp push --force
      - name: Deploy new version
        run: clasp deploy --deploymentId "${{ vars.DEPLOY_ID }}" --description "${{ github.ref_name }}"

      # Notifie le succès → lancer `npm run dump:rendered` en local pour vérifier le rendu
      - name: Notifier le déploiement (ntfy)
        if: success()
        continue-on-error: true
        run: |
          curl -s \
            -H "Title: Alfred déployé (${{ github.ref_name }})" \
            -H "Tags: white_check_mark" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Déploiement réussi — lance « npm run dump:rendered » pour vérifier le rendu." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
