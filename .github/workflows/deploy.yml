name: Deploy to GAS

permissions:
  contents: read
  pull-requests: read

run-name: Deploy to GAS (${{ github.ref_name }})

on:
  release:
    types: [published]
  push:
    branches: [dev]
    paths:
      - 'gas/**'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      run_all: ${{ github.event_name == 'release' }}

  deploy:
    needs: test
    # Déploie si les tests réussissent OU sont ignorés ; jamais s'ils échouent
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Push to Google Apps Script
        run: clasp push --force
      - name: Deploy new version
        env:
          DEPLOY_ID: ${{ vars.DEPLOY_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: clasp deploy --deploymentId "$DEPLOY_ID" --description "$REF_NAME"

      # Notifie le succès → lancer `npm run dump:rendered` en local pour vérifier le rendu
      - name: Notifier le déploiement (ntfy)
        if: success()
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s \
            -H "Title: Alfred déployé ($REF_NAME)" \
            -H "Tags: white_check_mark" \
            -H "Click: $RUN_URL" \
            -d "Déploiement réussi — lance « npm run dump:rendered » pour vérifier le rendu." \
            "https://ntfy.sh/$NTFY_TOPIC"
