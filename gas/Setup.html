<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfred — Installation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d1a;
      color: rgba(255,255,255,.9);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .setup-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 460px;
      width: 100%;
    }
    .setup-logo { font-size: 2.8rem; text-align: center; margin-bottom: 8px; }
    .setup-title {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #818cf8 30%, #b24bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .setup-sub {
      text-align: center;
      font-size: .82rem;
      color: rgba(255,255,255,.45);
      margin-bottom: 28px;
    }
    .setup-email {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .82rem;
      color: rgba(255,255,255,.6);
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.14);
      border-radius: 10px;
      padding: 12px 14px;
      color: rgba(255,255,255,.9);
      font-size: .88rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: #818cf8; }
    .setup-hint {
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      margin-top: 6px;
      margin-bottom: 20px;
    }
    .setup-hint a { color: #818cf8; text-decoration: none; }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:disabled { opacity: .5; cursor: default; }
    .setup-open {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .setup-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: .82rem;
      display: none;
    }
    .setup-msg.ok  { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: #34d399; }
    .setup-msg.err { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: #f87171; }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="setup-logo">🦥</div>
    <div class="setup-title">A.L.F.R.E.D</div>
    <div class="setup-sub">Installation du classeur</div>

    <div class="setup-email" id="setup-email">Chargement…</div>

    <p class="setup-hint">
      Un classeur <strong>Alfred — <span id="hint-email">(ton email)</span></strong> va être créé dans votre Google Drive à partir du modèle partagé.
    </p>

    <button id="setup-btn" onclick="doSetup()" disabled>Installer</button>
    <div class="setup-msg" id="setup-msg"></div>
  </div>

  <script>
    google.script.run
      .withSuccessHandler(info => {
        const setupEmail = info.email || 'Utilisateur inconnu';
        document.getElementById('setup-email').textContent = '👤 ' + setupEmail;
        document.getElementById('hint-email').textContent = setupEmail;
        document.getElementById('setup-btn').disabled = false;
      })
      .getSetupInfo();

    function doSetup() {
      const btn = document.getElementById('setup-btn');
      const msg = document.getElementById('setup-msg');
      const prev = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = 'Installation…';
      msg.style.display = 'none';

      const restore = _ => { btn.disabled = false; btn.innerHTML = prev; };

      google.script.run
        .withSuccessHandler(result => {
          restore();
          if (result.success) {
            showMsg('✅ Classeur « ' + result.title + ' » créé.', true);
            const a = document.createElement('a');
            a.href = result.url;
            a.target = '_top';
            a.className = 'setup-open';
            a.textContent = 'Ouvrir Alfred →';
            btn.replaceWith(a);
          } else {
            showMsg('❌ ' + result.error, false);
          }
        })
        .withFailureHandler(err => {
          restore();
          showMsg('❌ Erreur : ' + (err.message || 'inconnue'), false);
        })
        .createSheetFromTemplate();
    }

    function showMsg(text, ok) {
      const msg = document.getElementById('setup-msg');
      msg.textContent = text;
      msg.className = 'setup-msg ' + (ok ? 'ok' : 'err');
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
