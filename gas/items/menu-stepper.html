<li>
    <div class="action-item action-item--static">
        <span class="action-item-icon"><?= icon || '❓' ?></span>
        <div class="action-item-body">
            <div class="action-item-label"><?= label ?></div>
            <div class="action-item-desc"><?= desc ?></div>
        </div>
        <div class="stepper">
            <button id="btn-<?= name ?>-minus" class="stepper-btn" aria-label="−">−</button>
            <span id="<?= name ?>-value" class="stepper-value"><?= value ?></span>
            <button id="btn-<?= name ?>-plus" class="stepper-btn" aria-label="+">+</button>
        </div>
    </div>
</li>
