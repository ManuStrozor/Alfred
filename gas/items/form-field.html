<div class="form-group">
    <label for="<?= id ?>"><?= label ?> <span class="label-hint"><?= (typeof hint !== 'undefined' && hint) ? hint : '' ?></span></label>
    <input
        id="<?= id ?>"
        type="<?= type ?>"
        class="form-input"
        placeholder="<?= (typeof placeholder !== 'undefined' && placeholder) ? placeholder : '' ?>"
        autocomplete="<?= (typeof autocomplete !== 'undefined' && autocomplete) ? autocomplete : '' ?>"
        <?= (typeof step !== 'undefined' && step) ? `step="${step}"` : '' ?>
        <?= (typeof min !== 'undefined' && min) ? `min="${min}"` : '' ?>
        <?= (typeof maxlength !== 'undefined' && maxlength) ? `maxlength="${maxlength}"` : '' ?>
        <?= (typeof required !== 'undefined' && required) ? 'required' : '' ?>>
</div>
